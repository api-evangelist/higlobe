aid: higlobe
name: Higlobe
description: >-
  Higlobe is a regulated cross-border money transfer service that lets freelancers,
  independent contractors, and businesses receive international payments from clients
  in the United States and the European Union. Members open a USD or EUR receiving
  account, share a payment request or account details with their payer, and withdraw
  funds to a local bank account with near-instant, 24/7 settlement at a flat, low
  cost. The platform also offers a Visa Signature card, a yield on account balances,
  and payer-facing payment requests. Higlobe is registered as a Money Service Business
  (MSB) with FinCEN under the U.S. Department of the Treasury and publishes a SOC 2
  Type 2 / SOC 3 security posture. Higlobe is a consumer/business fintech product and
  does not currently publish a public developer API, OpenAPI, SDK, or developer portal;
  this profile captures its public identity, security, and commercial surface. Backed
  by Battery Ventures; added to the API Evangelist network for enrichment.
